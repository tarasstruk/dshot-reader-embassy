[package]
name = "dshot-reader-embassy"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"

[workspace]
members = ["dshot-codec", "esc-emu"]

[dependencies]
cortex-m-rt = "0.7.7"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
dshot-codec = { path = "dshot-codec" }
esc-emu = { path = "esc-emu" }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-rp = { version = "0.10.0", features = ["time-driver", "critical-section-impl", "rp2040"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.0"
embassy-usb = "0.6.0"
fixed = "1.29.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[profile.release]
# Full debug info for probe-rs: defmt log locations. It stays in the ELF, not in flash.
debug = 2

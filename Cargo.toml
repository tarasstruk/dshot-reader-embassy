[package]
name = "dshot-reader-embassy"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"

[workspace]
members = ["dshot-codec"]

[dependencies]
cortex-m-rt = "0.7.5"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
dshot-codec = { path = "dshot-codec" }
embassy-executor = { version = "0.7.0", features = ["arch-cortex-m", "executor-thread"] }
embassy-futures = "0.1.1"
embassy-rp = { version = "0.4.0", features = ["time-driver", "critical-section-impl", "rp2040"] }
embassy-sync = "0.7.0"
embassy-time = "0.4.0"
embassy-usb = "0.4.0"
fixed = "1.29.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
rp2040-boot2 = "0.3.0"

[profile.release]
# Full debug info for probe-rs: defmt log locations. It stays in the ELF, not in flash.
debug = 2
